name: build

on:
  push:
    branches: [main, gtk3]
    tags: ['v*.*.*']
  workflow_dispatch:

# When a tag build runs, attach the artifacts to a GitHub Release.
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Linux: native build with apt-installed GTK3 + libvte; produce .deb + .tar.gz
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config intltool \
            libgtk-3-dev libxml2-dev libglib2.0-dev libvte-2.91-dev \
            file fakeroot

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMOO_WITH_PYTHON=no \
            -DMOO_ENABLE_INSTALL_HOOKS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package (.deb + .tar.gz)
        working-directory: build
        run: cpack

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/medit-*.deb    dist/ 2>/dev/null || true
          cp build/medit-*.tar.gz dist/ 2>/dev/null || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: medit-linux
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────
  # macOS: native arm64 Apple Silicon build with Homebrew GTK3 + libvte
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Homebrew)
        run: |
          brew update
          brew install \
            cmake pkg-config intltool gettext \
            gtk+3 libxml2 vte3 adwaita-icon-theme

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/macos-arm64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DMOO_WITH_PYTHON=no \
            -DMOO_ENABLE_INSTALL_HOOKS=OFF

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.logicalcpu)"

      - name: Install into staging tree
        run: cmake --install build

      - name: Create .dmg
        run: |
          set -eux
          version=$(grep -E '^set\(MOO_MAJOR_VERSION'  CMakeLists.txt | grep -oE '[0-9]+').$(grep -E '^set\(MOO_MINOR_VERSION'  CMakeLists.txt | grep -oE '[0-9]+').$(grep -E '^set\(MOO_MICRO_VERSION'  CMakeLists.txt | grep -oE '[0-9]+')
          stage="dmg-stage/medit-${version}-macos-arm64"
          mkdir -p "$stage"
          # Copy the install tree as a relocatable bundle.  This DMG requires
          # the user to have GTK3 + vte3 installed via Homebrew (brew install
          # gtk+3 vte3); a fully-bundled .app with dylibbundler can be added
          # later if users ask for it.
          cp -R build/install/* "$stage/"
          cat > "$stage/README.txt" <<'EOF'
          medit (macOS, arm64) — install Homebrew runtime first:

              brew install gtk+3 vte3 adwaita-icon-theme

          Then run ./bin/medit
          EOF
          hdiutil create -volname "medit-${version}" \
                         -srcfolder dmg-stage \
                         -ov -format UDZO \
                         "medit-${version}-macos-arm64.dmg"
          ls -lh medit-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: medit-macos
          path: medit-*.dmg

  # ─────────────────────────────────────────────────────────────────────────
  # Windows: native MSYS2 MINGW64 build; produce Inno Setup .exe + portable .zip
  # VTE / terminal plugin is not available on Windows (auto-disabled).
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MSYS2 MINGW64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-hicolor-icon-theme
            intltool

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install --no-progress -y innosetup

      - name: Configure
        env:
          # Make sure cmake.exe finds the MinGW gcc/g++ from MSYS2.
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/build/install")" \
            -DMOO_WITH_PYTHON=no \
            -DMOO_ENABLE_INSTALL_HOOKS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install into staging tree
        run: cmake --install build

      - name: Bundle MinGW runtime DLLs and GTK data
        run: |
          set -eux
          stage=build/install
          mingw_bin=/mingw64/bin
          mingw_share=/mingw64/share
          mingw_lib=/mingw64/lib

          # ─── 1.  Recursive ldd walk ────────────────────────────────────
          # MSYS2's ldd walks transitively, but only one starting binary at
          # a time.  Seed the queue with medit.exe AND every gdk-pixbuf/gio
          # module we plan to ship, so loaders that pull in extra libs
          # (libsvg, libpng codecs, GnuTLS, etc.) get their DLLs copied too.
          declare -A copied
          queue=("$stage/bin/medit.exe")

          # Pre-stage the loader / module trees so we can ldd them in place.
          mkdir -p "$stage/lib"
          cp -R "$mingw_lib/gdk-pixbuf-2.0" "$stage/lib/"
          if [ -d "$mingw_lib/gio" ]; then
              cp -R "$mingw_lib/gio" "$stage/lib/"
          fi

          # Add every loader/module DLL to the BFS queue.
          while IFS= read -r -d '' dll; do
              queue+=("$dll")
          done < <(find "$stage/lib/gdk-pixbuf-2.0" "$stage/lib/gio" \
                       -name '*.dll' -print0 2>/dev/null)

          while [[ ${#queue[@]} -gt 0 ]]; do
              f="${queue[0]}"
              queue=("${queue[@]:1}")
              # ldd output: "name.dll => /mingw64/bin/name.dll (0x...)"
              while read -r dep; do
                  base=$(basename "$dep")
                  if [[ -z "${copied[$base]:-}" ]]; then
                      copied[$base]=1
                      cp -u "$dep" "$stage/bin/"
                      queue+=("$stage/bin/$base")
                  fi
              done < <(ldd "$f" 2>/dev/null | awk '/=> \/mingw64\// {print $3}')
          done
          echo "Bundled ${#copied[@]} DLLs."

          # Strip debug symbols from the bundled DLLs and medit.exe.
          # MSYS2 ships its DLLs with non-trivial symbol tables; stripping
          # typically halves their size with zero runtime impact.
          before=$(du -sb "$stage" | cut -f1)
          find "$stage/bin" "$stage/lib/gdk-pixbuf-2.0" "$stage/lib/gio" \
               \( -name '*.dll' -o -name '*.exe' \) -print0 \
              | xargs -0 -r strip --strip-unneeded || true
          after=$(du -sb "$stage" | cut -f1)
          echo "Strip saved $(( (before - after) / 1024 )) KB"

          # ─── 2.  GTK / GLib runtime data ───────────────────────────────
          mkdir -p "$stage/share/glib-2.0/schemas" \
                   "$stage/share/icons" \
                   "$stage/share/themes" \
                   "$stage/share/locale"

          cp -R "$mingw_share/glib-2.0/schemas" "$stage/share/glib-2.0/" || true
          cp -R "$mingw_share/icons/hicolor"    "$stage/share/icons/"    || true
          cp -R "$mingw_share/icons/Adwaita"    "$stage/share/icons/"    || true
          cp -R "$mingw_share/themes/Default"   "$stage/share/themes/"   || true
          cp -R "$mingw_share/themes/Emacs"     "$stage/share/themes/"   || true

          # Compile the GSettings schemas so GTK doesn't complain at startup.
          glib-compile-schemas "$stage/share/glib-2.0/schemas"

          # ─── 3.  Regenerate gdk-pixbuf loaders.cache for bundled tree ──
          # Default gdk-pixbuf-query-loaders writes absolute paths into the
          # cache, which break after the installer relocates the tree.
          # Run from inside the loaders dir and rewrite the absolute prefix
          # to a path relative to libgdk_pixbuf-2.0-0.dll's runtime location.
          loaders_dir="$stage/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          cache="$stage/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          if [ -d "$loaders_dir" ]; then
              GDK_PIXBUF_MODULEDIR="$loaders_dir" \
                  /mingw64/bin/gdk-pixbuf-query-loaders.exe > "$cache"
              # Replace MSYS-style absolute paths with the on-disk install
              # prefix so the cache resolves correctly post-install.  At
              # install time on the user's machine the loaders all live in
              # <install>/lib/gdk-pixbuf-2.0/2.10.0/loaders/, and gdk-pixbuf
              # accepts a forward-slash absolute path on Windows.
              sed -i "s|$(cygpath -m "$loaders_dir")|lib/gdk-pixbuf-2.0/2.10.0/loaders|g" "$cache"
          fi

      - name: Build Inno Setup installer + portable zip
        run: |
          set -eux
          cmake --build build --target installer
          cmake --build build --target portable
          ls -lh build/medit-*.exe build/medit-*.zip || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/medit-*.exe dist/ 2>/dev/null || true
          cp build/medit-*.zip dist/ 2>/dev/null || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: medit-windows
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────
  # Tag pushes: gather every platform's artifacts and attach to a Release.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten downloaded artifacts
        run: |
          mkdir release
          find artifacts -type f \( -name 'medit-*.deb' \
                                  -o -name 'medit-*.tar.gz' \
                                  -o -name 'medit-*.dmg' \
                                  -o -name 'medit-*.exe' \
                                  -o -name 'medit-*.zip' \) \
              -exec cp {} release/ \;
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
